<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birds Punctuate the Days | Joyce Clement</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-container">
        <header class="page-header">
            <h1>Birds Punctuate the Days</h1>
            <p class="author">A haiku by Joyce Clement</p>
        </header>

        <main>
            <section class="poem" aria-label="Haiku">
                <p>Period</p>
                <p>One blue egg all summer long</p>
                <p>Now Gone</p>
            </section>

            <figure>
                <img src="img/Haiku_image.jpg"
                     alt="A bright blue egg resting in a nest of grass">
                <figcaption>Birds Punctuate the Days</figcaption>
            </figure>
        </main>
    </div>
</body>
</html>
